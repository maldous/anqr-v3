name: validate

# The canonical validation chain, run on a clean checkout.
#
# This exists to decide the same repository truth the local clean-clone chain
# decides — not a convenient subset of it. The step list is asserted against
# package.json by tests/ci-parity.test.ts, so a step removed here fails the
# suite rather than quietly narrowing what CI checks.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run architecture
      - run: npm run build
      - run: npm run delivery
      - run: npm run validate
